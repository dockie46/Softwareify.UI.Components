name: Publish

# Publishes to GitHub Packages. Requires a repo secret — see below.
#
# 1. GitHub → Settings → Secrets and variables → Actions → New repository secret
# 2. Name: NPM_PUBLISH_TOKEN
# 3. Value: a PAT with at least read:packages + write:packages (classic), or a
#    fine-grained token with Packages read/write for this repository.
#
# The default GITHUB_TOKEN often returns 403 for org-scoped npm packages; a PAT fixes that.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # setup-node writes //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN} — token must be set for every npm command
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
    steps:
      - name: Require NPM_PUBLISH_TOKEN secret
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add repository secret NPM_PUBLISH_TOKEN (Settings → Secrets and variables → Actions). Use a GitHub PAT with read:packages and write:packages. Without it, npm publish gets ENEEDAUTH."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@softwareifycz"

      - name: Install dependencies
        run: npm ci

      # If this fails, the workflow is not running on a commit with the renamed package (push + new tag).
      - name: Verify package name (must be @softwareifycz/*)
        run: |
          NAME=$(node -p "require('./package.json').name")
          echo "package.json name: $NAME"
          case "$NAME" in
            @softwareifycz/*) ;;
            *)
              echo "::error::Still seeing old scope? Push your rename commit to GitHub, then run this workflow again (or move your v* tag to the new commit)."
              exit 1
              ;;
          esac

      - name: Publish to GitHub Packages
        run: npm publish
